# WI-MOB-002: if the allergy check cannot be made, the screen says so plainly (never "no conflicts") and still lets the customer order. The runner's flow-control
# server takes the BFF away while checkout opens and brings it back before the order is placed.
appId: com.bakerymarketplace.mobile
name: A failed allergy check is said plainly and does not block the order
onFlowComplete:
  - runScript: scripts/bff-start.js
  - runScript: scripts/set-profile.js
---
- runScript:
    file: scripts/set-profile.js
    env:
      ALLERGIES: tree-nut
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn:
    id: listing-Almond Croissant
- tapOn:
    id: add-to-order
- runScript: scripts/bff-stop.js
- tapOn:
    id: to-checkout
- assertVisible:
    id: check-failed
- assertVisible: ".*We could not check this order against your allergies.*"
- assertNotVisible:
    id: no-profile
- assertNotVisible:
    id: conflict-0
- assertVisible:
    id: place-order
    enabled: true
- runScript: scripts/bff-start.js
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
