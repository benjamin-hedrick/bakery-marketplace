# WI-MOB-002: Nora (a seeded tree-nut allergy); if the allergy check cannot be made, the screen says so plainly (never "no conflicts") and still lets the customer order.
# The failures come from the chaos scenario the runner gives the BFF (ADR-0024, WI-CHAOS-003, register 173): opening the Cardamom Honey Latte (a seeded listing only this
# flow uses) is the request that switches the BFF to `mobile-flows-07`, which fails Nora's first allergy-profile, allergy-check and payment-method calls and lets the
# retry of the payment methods through (the payment methods are asked for again, WI-ORD-010). The BFF is never stopped.
appId: com.bakerymarketplace.mobile
name: A failed allergy check is said plainly and does not block the order
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      USER_NAME: Nora
      USER_ROW: 1
- tapOn:
    id: listing-Cardamom Honey Latte # the request that opens it arms the scenario; it is made to order, so it never runs out
- tapOn:
    id: add-to-order
- tapOn:
    id: to-checkout
- assertVisible:
    id: check-failed
- assertVisible: '.*We could not check this order against your allergies.*'
- assertNotVisible:
    id: no-profile
- assertNotVisible:
    id: conflict-0
# The payment methods come from the same BFF, so they failed too: the order needs one, so the button is off until the customer asks again. The failed allergy
# check itself never blocks the order.
- assertVisible:
    id: payment-methods-failed
- tapOn:
    id: payment-methods-retry
- assertVisible:
    id: check-failed
- assertVisible:
    id: place-order
    enabled: true
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
