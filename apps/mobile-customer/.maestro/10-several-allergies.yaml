# WI-MOB-002: Max, a seeded customer with several saved entries: allergies to dairy and tree nuts, and an avoid for gluten. The Walnut Danish with extra walnuts gives serious
# warnings (dairy; tree nuts for the item and for the option) and a note (gluten). "Tell the bakery" lists both allergies, ticked; Max unticks dairy, and the order
# carries only the tree-nut allergy: what is told to the bakery is the customer's choice.
# The Walnut Danish is a seeded listing only this flow uses (made to order, so it never runs out; register 200). It is last in the list, so the flow scrolls to it.
appId: com.bakerymarketplace.mobile
name: With several allergies the customer chooses which are told to the bakery
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      USER_NAME: Max
      USER_ROW: 4
- assertVisible: Signed in as Max.*
- scrollUntilVisible:
    element:
      id: listing-Walnut Danish
- tapOn:
    id: listing-Walnut Danish
- tapOn:
    id: option-Extra walnuts.*
- tapOn:
    id: add-to-order
- tapOn:
    id: to-checkout
- assertVisible:
    id: conflict-0
- assertVisible:
    id: conflict-3
- assertVisible: '.*Allergy warning.*Walnut Danish contains milk.*which you listed as an allergy.*'
- assertVisible: '.*Allergy warning.*Walnut Danish contains tree nuts.*which you listed as an allergy.*'
- assertVisible: '.*Allergy warning.*Extra walnuts contains tree nuts.*'
- assertVisible: '.*You avoid this.*Walnut Danish contains gluten.*which you avoid.*'
- assertVisible:
    id: ack-needed
# Both allergies are offered, ticked.
- scrollUntilVisible:
    element:
      id: tell-dairy
- assertVisible:
    id: tell-tree-nut
- tapOn:
    id: tell-dairy
# Acknowledge, then place the order.
- scrollUntilVisible:
    element:
      id: acknowledge
    direction: UP
- tapOn:
    id: acknowledge
- scrollUntilVisible:
    element:
      id: place-order
- assertVisible:
    id: place-order
    enabled: true
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
# Dairy was unticked: only the tree-nut allergy was told to the bakery.
- runScript:
    file: scripts/assert-last-order-allergens.js
    env:
      USER_ID: user-customer-several
      EXPECT: tree-nut
