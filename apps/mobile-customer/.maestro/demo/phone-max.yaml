# The demo film's phone customer (register 163, docs/operations/demo-film.md): Max, a seeded customer with dairy and tree-nut allergies and a gluten avoid, orders the
# Almond Croissant with extra almonds, sees the warnings, acknowledges them, orders, and then cancels before the bakery has accepted.
# NOT a test: nothing here is asserted for its own sake, and the pauses are for a viewer (shortened 2026-11-08 after the first film run, which was too slow). The film
# director (scripts/dev/film/film.mjs) starts it, waits for "phone-ready", releases it with "go-phone" and answers the pauses; FILM_URL is passed with -e. The first
# screen is the sign-in screen the app is already showing; the flow restarts the app so the recording shows its splash screen.
appId: com.bakerymarketplace.mobile
name: Demo film, phone customer (Max)
---
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-ready
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /wait?name=go-phone
- launchApp # the splash screen, then sign-in
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=2000
- runFlow:
    file: ../subflows/login.yaml
    env:
      USER_NAME: Max
      USER_ROW: 4
- assertVisible: Signed in as Max.*
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=2000
- tapOn:
    id: listing-Almond Croissant
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=1500
- tapOn:
    id: option-Extra almonds.*
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=1500
- tapOn:
    id: add-to-order
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=2000
- tapOn:
    id: to-checkout
- assertVisible:
    id: conflict-0
# The director holds the web customer at its own warnings until this arrives, so the caption about both customers' warnings is true of both screens.
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-warnings
# The warnings, long enough to read.
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=5000
- scrollUntilVisible:
    element:
      id: acknowledge
    direction: UP
- tapOn:
    id: acknowledge
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=1500
- scrollUntilVisible:
    element:
      id: place-order
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-ordered
# Max changes his mind while the order is still "Order received": a customer can cancel until the bakery starts preparing, and the vendor agent does not touch a new
# order for 7 s. (The first version waited for "Order confirmed" first; with the vendor working the newest orders first, the bakery had already started preparing by
# the time the phone showed the confirmation, and the cancel was refused: register 163.)
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=3000
- tapOn:
    id: cancel-order
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=1000
- tapOn:
    id: cancel-confirm
- assertVisible: Order cancelled
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-cancelled
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=4000
