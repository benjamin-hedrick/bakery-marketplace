# The demo film's phone customer (register 163, docs/operations/demo-film.md): Max, a seeded customer with dairy and tree-nut allergies and a gluten avoid, orders the
# Almond Croissant with extra almonds, sees the warnings, acknowledges them, orders, waits for the bakery to accept, and then cancels.
# NOT a test: nothing here is asserted for its own sake, and the pauses are for a viewer. The film director (scripts/dev/film/film.mjs) starts it, waits for "phone-ready",
# releases it with "go-phone" and answers the pauses; FILM_URL is passed with -e. The first screen is the sign-in screen the app is already showing; the flow
# restarts the app so the recording shows its splash screen. NEVER RUN (written 2026-11-07); expect to adjust on the first run.
appId: com.bakerymarketplace.mobile
name: Demo film, phone customer (Max)
---
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-ready
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /wait?name=go-phone
- launchApp # the splash screen, then sign-in
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=3500
- runFlow:
    file: ../subflows/login.yaml
    env:
      USER_NAME: Max
      USER_ROW: 4
- assertVisible: Signed in as Max.*
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=3500
- tapOn:
    id: listing-Almond Croissant
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=3000
- tapOn:
    id: option-Extra almonds.*
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=2500
- tapOn:
    id: add-to-order
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=4000
- tapOn:
    id: to-checkout
- assertVisible:
    id: conflict-0
# The warnings, long enough to read.
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=7000
- scrollUntilVisible:
    element:
      id: acknowledge
    direction: UP
- tapOn:
    id: acknowledge
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=2500
- scrollUntilVisible:
    element:
      id: place-order
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-ordered
# The bakery accepts when its queue gets to this order (a few seconds, by the vendor agent); a plain confirmation is already there.
- extendedWaitUntil:
    visible: Order confirmed
    timeout: 120000
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=2500
- tapOn:
    id: cancel-order
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=1500
- tapOn:
    id: cancel-confirm
- assertVisible: Order cancelled
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /beat?name=phone-cancelled
- runScript:
    file: scripts/film-call.js
    env:
      CALL: /pause?ms=6000
