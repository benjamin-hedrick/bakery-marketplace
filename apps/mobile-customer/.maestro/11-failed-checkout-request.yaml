# WI-MOB-003: the checkout request fails when the order is placed. The app says the order could not be placed, keeps the order, and a retry places
# exactly one order (the count of Alice's orders goes up by one). The runner's flow-control server counts the orders.
# The failure is a chaos scenario (ADR-0024, chaos/scenarios/mobile-flows.json) that the runner switches on for the BFF: the first attempt of one order fails,
# and nothing else does. The order is the one it names: two Oat Milk Lattes paid with Alice's accepted card (pm-alice-ok), which no other flow places. The
# retry carries the same idempotency key (the app reuses it for the same content) and goes through. The BFF stays up all the while.
appId: com.bakerymarketplace.mobile
name: A failed checkout request keeps the order and a retry places one order
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn:
    id: listing-Oat Milk Latte # made to order, so it never runs out
- tapOn:
    id: quantity-more # two lattes: the order the scenario names (no other flow places it)
- tapOn:
    id: add-to-order
- tapOn:
    id: to-checkout
- assertVisible:
    id: place-order
- runScript: scripts/remember-order-count.js
- tapOn:
    id: place-order
- assertVisible:
    id: checkout-rejection
- assertVisible: The order could not be placed. Please try again.
# Still on the checkout page, the order is still there, and nothing was placed.
- assertVisible: Order (2)
- assertNotVisible:
    id: order-headline
- runScript:
    file: scripts/assert-order-count.js
    env:
      MORE: 0
# The retry places the order, once.
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
- assertVisible: Order (0)
- runScript:
    file: scripts/assert-order-count.js
    env:
      MORE: 1
