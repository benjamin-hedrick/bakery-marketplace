# WI-MOB-003: the BFF cannot be reached when the order is placed. The app says the order could not be placed, keeps the order, and a retry once the BFF is back places
# exactly one order (the count of Alice's orders goes up by one). The runner's flow-control server takes the BFF away and brings it back and counts the orders.
appId: com.bakerymarketplace.mobile
name: A failed checkout request keeps the order and a retry places one order
onFlowComplete:
  - runScript: scripts/bff-start.js
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn:
    id: listing-Oat Milk Latte # made to order, so it never runs out
- tapOn:
    id: add-to-order
- tapOn:
    id: to-checkout
- assertVisible:
    id: place-order
- runScript: scripts/remember-order-count.js
- runScript: scripts/bff-stop.js
- tapOn:
    id: place-order
- assertVisible:
    id: checkout-rejection
- assertVisible: The order could not be placed. Please try again.
# Still on the checkout page, the order is still there, and nothing was placed.
- assertVisible: Order (1)
- assertNotVisible:
    id: order-headline
- runScript: scripts/bff-start.js
- runScript:
    file: scripts/assert-order-count.js
    env:
      MORE: 0
# The retry places the order, once.
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
- assertVisible: Order (0)
- runScript:
    file: scripts/assert-order-count.js
    env:
      MORE: 1
