# The failure flow: a declined payment says so and keeps the order, and the customer can try again. Needs the test build (the decline switch exists
# only when the app was built with EXPO_PUBLIC_TEST_HOOKS=1) and a BFF with ENABLE_TEST_HOOKS=1 (scripts/dev/mobile-stack.mjs starts one).
appId: com.bakerymarketplace.mobile
name: A declined payment keeps the order
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn:
    id: listing-Brown Butter Cookies
- tapOn:
    id: add-to-order
- tapOn:
    id: to-checkout
- tapOn:
    id: decline-test
- tapOn:
    id: place-order
- assertVisible:
    id: checkout-rejection
- assertVisible: The payment was declined.
# Still on the checkout page, and the order is still there.
- assertVisible: Order (1)
- assertNotVisible:
    id: order-headline
# Trying again without the decline places the order.
- tapOn:
    id: decline-test
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
- assertVisible: Order (0)
