# The failure flow: choosing the saved payment method whose token is invalid is declined and says so, keeps the order, and choosing the customer's accepted
# method then places it. Alice's two methods are seed data (tools/BakeryMarketplace.Seed, PaymentSeedData): the accepted one is first (preselected), the
# second is "refused" because its token fails ordering's token rule. No test switch or build variant is involved (WI-ORD-010).
appId: com.bakerymarketplace.mobile
name: A declined payment keeps the order
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn:
    id: listing-Brown Butter Cookies
- tapOn:
    id: add-to-order
- tapOn:
    id: to-checkout
# The accepted method is chosen to begin with; choose the refused one.
- assertVisible: ".*Test card \\(accepted\\).*"
- tapOn:
    id: payment-1
- tapOn:
    id: place-order
- assertVisible:
    id: checkout-rejection
- assertVisible: The payment was declined.
# Still on the checkout page, and the order is still there.
- assertVisible: Order (1)
- assertNotVisible:
    id: order-headline
# Choosing the accepted method places the order.
- tapOn:
    id: payment-0
- tapOn:
    id: place-order
- assertVisible:
    id: order-headline
- assertVisible: Order (0)
