# Login, the menu with stock, a restart that needs no new login (refresh token in the Keystore), and logout (the token is deleted).
appId: com.bakerymarketplace.mobile
name: Login, restart without login, logout
---
- launchApp:
    clearState: true
- assertVisible:
    id: login-button
- runFlow: subflows/login.yaml
# Who is signed in, from the token's name claim (display only).
- assertVisible:
    id: signed-in-as
- assertVisible: Signed in as Alice Customer
- assertVisible: Country Sourdough
- assertVisible: Low stock
- assertVisible: Sold out
# A restart keeps the session: no login screen.
- stopApp
- launchApp
- assertVisible:
    id: listings
- assertNotVisible:
    id: login-button
# The name comes back with the renewed session too.
- assertVisible: Signed in as Alice Customer
# Logout returns to the login screen, and a restart does not bring the session back.
- tapOn:
    id: sign-out
- assertVisible:
    id: login-button
- stopApp
- launchApp
- assertVisible:
    id: login-button
