# Quality and CI baseline (WI-PORT-003, ADR-0015).
#
# NOT YET SEEN FULLY GREEN ON AZURE: first runs started 2026-10-28 and found the problems recorded in
# docs/evidence/WI-PORT-003/findings.md. Every command below was also run locally (Windows, Node 25.9, .NET SDK 10,
# Docker Desktop); that file lists what passed and what was not run.
# Commands, gaps and the results format: docs/process/quality-gates.md.
#
# Gates here: secret scan, documentation checks, format/style, lint, build, type-check, unit/integration tests, the real-stack walking-skeleton smoke.
# Do not read a green run as "covered": the Cosmos adapter tests do not touch Cosmos.
#
# The GitHub placeholder workflow (.github/workflows/ci.yml) was removed on 2026-10-28 (ADR-0015 amendment); this pipeline
# is the only CI.
# No credentials appear in this file. The only key in the repo's CI scripts is the Cosmos emulator's published fixed key.
# Triggers (decided 2026-10-28, to save build minutes): nothing runs on pushes to any branch, including main. The pipeline
# runs (a) on pull requests into main (draft PRs are skipped) and (b) when someone queues it by hand, which is how main is
# gated: Run pipeline on main, choose the branch explicitly. PR validation stays on so ADR-0015's "required checks" exit
# criterion can still be met.
trigger: none
pr:
  branches:
    include: [main]
  drafts: false

pool:
  # Pinned, not ubuntu-latest: the latest label migrates to Ubuntu 26.04 between 2026-10-19 and about 2026-11-19, and jobs
  # can land on either image meanwhile (runner-images issue 14748). Move to ubuntu-26.04 deliberately, after a run on it.
  vmImage: ubuntu-24.04

variables:
  NODE_VERSION: '24.x'
  # 127.0.0.1, not localhost: on some hosts "localhost" resolves to IPv6, the connection fails, and the Redis adapter tests
  # silently fall back to in-memory fakes (found 2026-10-28, docs/evidence/WI-PORT-003/findings.md).
  REDIS_CONNECTION_STRING: '127.0.0.1:6379'
  RESULTS: $(Build.ArtifactStagingDirectory)/results

jobs:
  # Secret scan of the full git history (register item 93, WI-SEC-004). Config: .gitleaks.toml. The command and the
  # digest-pinned image are in scripts/ci/secret-scan.mjs. Written 2026-10-30, run locally; NOT YET RUN ON AZURE.
  - job: secrets
    displayName: Secret scan (gitleaks, full history)
    steps:
      - checkout: self
        fetchDepth: 0
      - script: node scripts/ci/secret-scan.mjs
        displayName: Scan history for secrets (fails on a finding)

  # Documentation checks (register item 90): the status check (a spec without a banner, a header that disagrees with its banner, a stale
  # STATUS.md) and the link check (a broken relative link). Both are fast and need only Node. Written 2026-10-30; NOT YET RUN ON AZURE.
  - job: docs
    displayName: Documentation checks (status, links)
    steps:
      - task: UseNode@1
        displayName: Node $(NODE_VERSION)
        inputs:
          version: $(NODE_VERSION)
      - script: node scripts/docs/status.mjs --check
        displayName: Status check (fails when a banner, a header or STATUS.md is wrong; fix with node scripts/docs/status.mjs)
      - script: node scripts/docs/linkcheck.mjs . --fail-on-broken-links
        displayName: Link check (fails on a broken relative link; broken backtick paths are only counted)
      - script: node scripts/docs/traceability.mjs --check
        displayName: Traceability table is current (fix with node scripts/docs/traceability.mjs)

  - job: dotnet
    displayName: .NET build and tests
    steps:
      - script: mkdir -p $(RESULTS)
        displayName: Create results directory
      - task: UseDotNet@2
        displayName: .NET 10 SDK (every project targets net10.0)
        inputs:
          version: '10.0.x'
      - task: UseNode@1
        inputs:
          version: $(NODE_VERSION)
      - script: |
          docker compose up -d --wait redis-events
          node scripts/ci/redis-touch.mjs snapshot $(Agent.TempDirectory)/redis-before
        displayName: Start Redis for the adapter tests (fresh container per run)
      - script: dotnet build BakeryMarketplace.slnx --configuration Release
        displayName: Build
      - script: |
          dotnet format whitespace BakeryMarketplace.slnx --verify-no-changes
          dotnet format style BakeryMarketplace.slnx --verify-no-changes
        displayName: Format and style check (fix locally with dotnet format)
      - script: dotnet test tools/BakeryMarketplace.slnx --configuration Release --logger "trx" --results-directory $(RESULTS)/trx
        displayName: Test shared libraries
      - script: dotnet test services/catalog-service/tests/CatalogService.Tests --configuration Release --logger "trx" --results-directory $(RESULTS)/trx
        displayName: Test catalog-service
      - script: dotnet test services/ordering-service/tests/OrderingService.Tests --configuration Release --logger "trx" --results-directory $(RESULTS)/trx
        displayName: Test ordering-service
      - script: |
          set -o pipefail  # a failed script must fail the step, not tee's exit code
          node scripts/ci/redis-touch.mjs assert $(Agent.TempDirectory)/redis-before 50 2>&1 | tee $(RESULTS)/redis-touch.txt
        displayName: Prove the Redis adapter tests reached real Redis (finding A8)
      - script: |
          echo "##vso[task.logissue type=warning]Cosmos adapter tests did NOT run against Cosmos: they fall back to FakeRepository (open item #31, WI-DATA-003). A green Data.Tests run says nothing about the real adapter."
        displayName: Report what is not covered
      - script: |
          set -o pipefail  # a failed script must fail the step, not tee's exit code
          node scripts/ci/summarize-results.mjs --json $(RESULTS)/dotnet-summary.json $(RESULTS)/trx/*.trx | tee $(RESULTS)/dotnet-summary.md
        displayName: Summarize results
        condition: succeededOrFailed()
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '$(RESULTS)/trx/*.trx'
          testRunTitle: dotnet
      - script: docker compose down
        displayName: Stop Redis
        condition: always()
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: $(RESULTS)
          artifact: dotnet-results

  - job: bff
    displayName: GraphQL BFF
    steps:
      - script: mkdir -p $(RESULTS)
        displayName: Create results directory
      - task: UseNode@1
        inputs:
          version: $(NODE_VERSION)
      - script: npm ci
        workingDirectory: services/graphql-bff
        displayName: Install
      - script: npm run format:check
        workingDirectory: services/graphql-bff
        displayName: Format check (Prettier)
      - script: npm run lint
        workingDirectory: services/graphql-bff
        displayName: Lint (ESLint)
      - script: npm run typecheck
        workingDirectory: services/graphql-bff
        displayName: Typecheck
      - script: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=$(RESULTS)/bff-junit.xml "test/**/*.test.ts"
        workingDirectory: services/graphql-bff
        displayName: Test
      - script: node scripts/ci/summarize-results.mjs --json $(RESULTS)/bff-summary.json $(RESULTS)/bff-junit.xml
        displayName: Summarize results
        condition: succeededOrFailed()
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '$(RESULTS)/bff-junit.xml'
          testRunTitle: graphql-bff
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: $(RESULTS)
          artifact: bff-results

  - job: web
    displayName: web-customer (mock BFF)
    steps:
      - script: mkdir -p $(RESULTS)
        displayName: Create results directory
      - task: UseNode@1
        inputs:
          version: $(NODE_VERSION)
      - script: npm ci
        workingDirectory: apps/web-customer
        displayName: Install
      - script: npm run format:check
        workingDirectory: apps/web-customer
        displayName: Format check (Prettier; also covers scripts/ and this file)
      - script: npm run lint
        workingDirectory: apps/web-customer
        displayName: Lint (ESLint, Next.js rules)
      - script: npm run typecheck
        workingDirectory: apps/web-customer
        displayName: Typecheck (runs relay-compiler first)
      - script: npm run test:unit
        workingDirectory: apps/web-customer
        displayName: Unit tests (login library, Node test runner)
      - script: npx playwright install --with-deps chromium
        workingDirectory: apps/web-customer
        displayName: Install Chromium
      - script: npm run test:e2e -- --reporter=list,junit
        workingDirectory: apps/web-customer
        displayName: Build and e2e against the mock GraphQL server (WI-PORT-001 suite)
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: $(RESULTS)/web-mock-junit.xml
      - script: node scripts/ci/summarize-results.mjs --json $(RESULTS)/web-summary.json $(RESULTS)/web-mock-junit.xml
        displayName: Summarize results
        condition: succeededOrFailed()
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '$(RESULTS)/web-mock-junit.xml'
          testRunTitle: web-customer-mock
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: $(RESULTS)
          artifact: web-results
      - script: mkdir -p apps/web-customer/test-results
        displayName: Ensure the Playwright output folder exists
        condition: failed()
      - task: PublishPipelineArtifact@1
        displayName: Publish Playwright traces and screenshots (failures only)
        condition: failed()
        inputs:
          targetPath: apps/web-customer/test-results
          artifact: web-playwright-traces

  - job: skeleton
    displayName: Walking skeleton (real stack)
    steps:
      - script: mkdir -p $(RESULTS)
        displayName: Create results directory
      - task: UseDotNet@2
        displayName: .NET 10 SDK (seed tool and catalog-service target net10.0)
        inputs:
          version: '10.0.x'
      - task: UseNode@1
        inputs:
          version: $(NODE_VERSION)
      - script: npm ci
        workingDirectory: services/graphql-bff
        displayName: Install BFF
      - script: npm ci
        workingDirectory: apps/web-customer
        displayName: Install web-customer
      - script: npx playwright install --with-deps chromium
        workingDirectory: apps/web-customer
        displayName: Install Chromium
      - script: node scripts/ci/skeleton-smoke.mjs
        displayName: Compose, seed, catalog-service, ordering-service, BFF, Next.js, Playwright
      - script: node scripts/ci/summarize-results.mjs --json artifacts/skeleton/skeleton-summary.json artifacts/skeleton/playwright-junit.xml
        displayName: Summarize results
        condition: succeededOrFailed()
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'artifacts/skeleton/playwright-junit.xml'
          testRunTitle: walking-skeleton
      - task: PublishPipelineArtifact@1
        displayName: Publish service logs and results
        condition: succeededOrFailed()
        inputs:
          targetPath: artifacts/skeleton
          artifact: skeleton-logs
      - script: mkdir -p apps/web-customer/test-results
        displayName: Ensure the Playwright output folder exists
        condition: failed()
      - task: PublishPipelineArtifact@1
        displayName: Publish Playwright traces and screenshots (failures only)
        condition: failed()
        inputs:
          targetPath: apps/web-customer/test-results
          artifact: skeleton-playwright-traces
