# As local.yaml, plus Jaeger (opt-in compose profile `jaeger`). Select with OTEL_COLLECTOR_CONFIG=local-jaeger.yaml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  attributes/safety:
    actions:
      - key: url.query
        action: delete
      - key: http.url
        action: delete
  batch: {}

exporters:
  otlphttp/aspire:
    endpoint: http://aspire-dashboard:18890
    compression: none # the Aspire dashboard's OTLP/HTTP endpoint does not decode gzip
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/safety, batch]
      exporters: [otlphttp/aspire, otlp/jaeger]
