# TypeScript types for the BFF's resolvers, generated from the schema, so a field added to, removed from or changed in
# schema/schema.graphql without the matching resolver change fails the typecheck instead of failing at run time.
#   npm run codegen      writes src/__generated__/schema-types.ts (committed)
#   npm run typecheck    first checks that the committed file matches the schema, then runs tsc
schema: schema/schema.graphql
generates:
  src/__generated__/schema-types.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      # The BFF runs its TypeScript by type stripping (erasableSyntaxOnly): no enums, type-only imports.
      enumsAsTypes: true
      useTypeImports: true
      # graphql-js calls a root value's functions directly, so the resolver type is the function alone.
      makeResolverTypeCallable: true
      contextType: ../resolvers.ts#Context
      strictScalars: true
      scalars:
        DateTime: string
