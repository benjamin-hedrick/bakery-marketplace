# Manual operations on the UAT environment (ADR-0020 decision 9 and its note of 2026-11-21; WI-DEP-002 step 8). Register this file as its OWN
# pipeline ("bakery-uat-operations"); it never runs by itself: no push trigger, no pull-request trigger.
#
# STATE OF THIS FILE (2026-11-22): registered and rehearsed, no real run yet. What it needs in Azure and Azure DevOps exists (WI-DEP-002 step 7, the
# lead's bootstrap of 2026-11-21: rg-bakery-uat, the tfstate-uat container, the bakery-uat-plan and bakery-uat-deploy connections, the uat-infra,
# uat-app and uat-destroy approval environments, and the variables below). UAT has identities of its own, none shared with dev (register 231). The
# gate rehearsal (planMode rehearsal, devBuild 100) passed G1 to G6 and G8 on 2026-11-22 (docs/evidence/WI-DEP-002/uat-rehearsal-2026-11-22.md).
#
# The stages are dev's (pipelines/templates/environment-stages.yml), in promote mode:
#   inputs      also checks the issuer inputs and, with this run's own token, that devBuild is a real deploy of the dev pipeline from main whose
#               smoke stage succeeded (scripts/ci/promote-check.mjs). Only then does anything else run.
#   images      builds nothing: fetches that dev run's record of its pushed digests, checks it is that run's, and publishes it as uat-images-pushed.
#   infra_plan, infra_apply, app_deploy, smoke, observe, destroy: as in dev, against infra/environments/uat and rg-bakery-uat, with UAT's own
#               plan and deploy connections and approval environments. app_deploy pushes nothing (the digests are already in the foundation's registry) and
#               runs the seed job only when the seed input is on.
# The services run as Production (infra/environments/uat). No chaos scenario is offered (ADR-0024).
#
# Pipeline variables (Pipelines > bakery-uat-operations > Edit > Variables; set in Azure DevOps, never in this repository):
#   plain (they name private resources; none is a secret): ARM_SUBSCRIPTION_ID, TF_STATE_ACCOUNT, DEPLOY_PRINCIPAL_ID (bakery-uat-deploy's object
#   id), KEY_VAULT_NAME, COSMOS_ACCOUNT_NAME (UAT's own, globally unique), PLAN_CONNECTION_ID and DEPLOY_CONNECTION_ID, DEV_PIPELINE_ID (the dev
#   pipeline's definition id, for the promote check), and the foundation's outputs for uat, which this pipeline does not read from the foundation's
#   state (register 214; approved 2026-11-21 on the condition that no secret is exposed or logged; none of them is one, and no step prints them):
#   REGISTRY_LOGIN_SERVER, APP_IDENTITY_ID and APP_IDENTITY_PRINCIPAL_ID (terraform -chdir=infra/foundation output app_identities, entry uat);
#   secret (masked in the log): BUDGET_CONTACT_EMAIL.
trigger: none
pr: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: deploy
    values:
      - deploy # infrastructure (only if the plan has changes), then the promoted application
      - destroy # the teardown
  - name: devBuild
    # Refused unless it was a real deploy from main whose smoke passed (scripts/ci/promote-check.mjs).
    displayName: Dev run id to promote
    type: number
    default: 0
  - name: planMode
    # rehearsal: every infrastructure step only prints and uses no service connection, to prove the approval gates
    # (docs/operations/runbooks/prove-the-pipeline-gates.md).
    displayName: Plan mode (rehearsal = print only)
    type: string
    default: real
    values:
      - real
      - rehearsal
  - name: simulateInfrastructureChanges
    displayName: Rehearsal only. Pretend the plan has changes
    type: boolean
    default: true
  - name: holdSeconds
    displayName: Rehearsal only. Seconds the apply step holds the lock
    type: number
    default: 0
  - name: seed
    # Before the apps are updated; fixture data. Off by default: UAT keeps the data it holds.
    displayName: Run the seed job
    type: boolean
    default: false
  - name: mockIssuer
    # UAT's only issuer until Entra: a run with it off is refused until then (register 222), so it defaults to on.
    displayName: Deploy the mock issuer
    type: boolean
    default: true
  - name: issuerRoles
    displayName: Mock issuer roles (any but Customer needs allowed IPs)
    type: string
    default: Customer
    values:
      - Customer
      - Customer,Vendor
      - Customer,Admin
      - Customer,Vendor,Admin
  - name: issuerAllowedIps
    # The web app's and the mock issuer's ingress. Shown in the run's parameters; the agent's smoke cannot reach a restricted environment.
    displayName: Allowed IPv4 ranges (none = everyone; smoke needs none)
    type: string
    default: none
  - name: confirmEnvironment
    displayName: Type uat to confirm a destroy
    type: string
    default: none # not empty: the run dialog keeps Next disabled while a text box is blank; any value but the environment name fails a destroy

variables:
  ENVIRONMENT_NAME: uat
  RESOURCE_GROUP: rg-bakery-uat
  FOUNDATION_RESOURCE_GROUP: rg-bakery-foundation
  # The same Terraform as dev (scripts/ci/tests/pipeline-structure.test.mjs checks the two files agree).
  TF_VERSION: 1.17.1
  TF_ZIP_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061

pool:
  vmImage: ubuntu-24.04

stages:
  # Every stage is in the shared template; this file gives it UAT's connections and approval environments, in promote mode.
  - template: pipelines/templates/environment-stages.yml
    parameters:
      environmentName: uat
      imageSource: promote
      devBuild: ${{ parameters.devBuild }}
      action: ${{ parameters.action }}
      planMode: ${{ parameters.planMode }}
      simulateInfrastructureChanges: ${{ parameters.simulateInfrastructureChanges }}
      holdSeconds: ${{ parameters.holdSeconds }}
      confirmEnvironment: ${{ parameters.confirmEnvironment }}
      seed: ${{ parameters.seed }}
      mockIssuer: ${{ parameters.mockIssuer }}
      issuerRoles: ${{ parameters.issuerRoles }}
      issuerAllowedIps: ${{ parameters.issuerAllowedIps }}
      planConnection: bakery-uat-plan
      deployConnection: bakery-uat-deploy
      infraEnvironment: uat-infra
      appEnvironment: uat-app
      destroyEnvironment: uat-destroy
