# Local development environment (WI-DEV-002). Local only: nothing here is hardened.
#
#   docker compose up -d                       # default set: event backbone, Cosmos emulator, mock OIDC issuer
#   docker compose --profile with-redis up -d  # plus the cache Redis (ADR-0002), opt-in
#   docker compose --profile tracing up -d    # plus the Aspire dashboard (trace viewer), opt-in
#   docker compose --profile tracing --profile collector up -d   # services -> collector -> Aspire (the cloud shape)
#   OTEL_COLLECTOR_CONFIG=local-jaeger.yaml docker compose --profile tracing --profile collector --profile jaeger up -d
#   node scripts/dev/check-env.mjs             # readiness check (add --with-redis when using the profile)
#
#   docker compose --profile apps up -d --build   # plus the four application containers (WI-DEP-001): catalog, ordering, BFF, web
#
# By default the application services are NOT containers: run them on the host (`dotnet run`) against these ports.
# The `apps` profile runs the same images the cloud dev environment will use. Seed with `dotnet run --project tools/BakeryMarketplace.Seed`.
# See docs/operations/local-dev.md for the environment variables each service expects.
#
# All ports bind to 127.0.0.1 only. The mock issuer signs tokens for anyone who asks and the Redis
# instances have no password, so none of this may be reachable from the network.
name: bakery-marketplace

services:
  # Event backbone locally: Redis Streams (ADR-0003). Default service.
  redis-events:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_EVENTS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Primary data store locally: Cosmos DB Linux emulator, vNext (ADR-0004). Default service.
  # vNext serves plain HTTP and has partial API coverage (open item #2). Pinned to a dated build rather than the
  # floating `vnext-preview` tag, because emulator and Cosmos SDK versions must match (this build needs SDK 3.63.x+).
  # Data is not persisted across `down`, which is fine because seeding (WI-DEV-004) is idempotent.
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20261019
    ports:
      - "127.0.0.1:${COSMOS_PORT:-8081}:8081"
      - "127.0.0.1:${COSMOS_EXPLORER_PORT:-1234}:1234"

  # Local stand-in for Entra External ID (ADR-0006, WI-AUTH-005). Default service.
  # The issuer URL is taken from the request host, so Auth__Authority must be exactly
  # http://localhost:${MOCK_OIDC_PORT} for any client that validates tokens it issues.
  mock-oidc:
    build:
      context: .
      dockerfile: tools/BakeryMarketplace.MockOidcHost/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development # the host refuses to start in Production
      Auth__Audience: bakery-marketplace
      # Service clients for the client credentials grant (ADR-0018). The secret comes from the git-ignored .env, generated by
      # `node scripts/dev/init-env.mjs`; with no secret the client is simply not registered. The role is not a secret.
      MockOidc__Clients__ordering-service__Secret: ${ORDERING_CLIENT_SECRET:-}
      MockOidc__Clients__ordering-service__Roles__0: Stock.Reserve
      # The issuer string is the address the browser uses. Containers reach this host by its service name, so without a fixed issuer the
      # same issuer would appear under two names (the apps profile validates tokens against http://localhost:5100).
      MockOidc__Issuer: http://localhost:${MOCK_OIDC_PORT:-5100}
    ports:
      - "127.0.0.1:${MOCK_OIDC_PORT:-5100}:5100"

  # Cache Redis (ADR-0002). Opt-in via --profile with-redis; without it CACHE_BACKEND=local applies.
  # Deliberately a separate instance from redis-events so cache eviction can never touch the event streams.
  redis-cache:
    image: redis:7.4-alpine
    profiles: ["with-redis"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local trace viewer (ADR-0016 amendment 2026-10-28, WI-PORT-005). Opt-in via --profile tracing; services export
  # only when OTEL_EXPORTER_OTLP_ENDPOINT is set (docs/operations/local-dev.md). Anonymous access, so it is bound to
  # 127.0.0.1 like everything else here. Traces are kept in memory and lost on restart. UAT/Prod use Jaeger (not built).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    profiles: ["tracing"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${ASPIRE_UI_PORT:-18888}:18888"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:18889"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:18890"

  # OpenTelemetry Collector (ADR-0016 amendment). Opt-in via --profile collector. Services send OTLP here instead of
  # straight to the dashboard; it applies the data-safety processor and fans out. Same shape as DEV/UAT/Prod
  # (infra/otel-collector/cloud.yaml). Host ports differ from the dashboard's so both modes can be tried side by side.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: ["collector"]
    command: ["--config=/etc/otelcol/${OTEL_COLLECTOR_CONFIG:-local.yaml}"]
    volumes:
      - ./infra/otel-collector:/etc/otelcol:ro
    ports:
      - "127.0.0.1:${COLLECTOR_OTLP_GRPC_PORT:-4327}:4317"
      - "127.0.0.1:${COLLECTOR_OTLP_HTTP_PORT:-4328}:4318"

  # Jaeger, opt-in (profile jaeger), for trying the UAT/Prod option locally. Needs OTEL_COLLECTOR_CONFIG=local-jaeger.yaml.
  # Traces are kept in memory and lost on restart.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["jaeger"]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  # ---- Application containers (profile apps, WI-DEP-001). Local only, like everything in this file. -----------------------------
  # Development environment on purpose: the services then accept the plain-HTTP mock issuer (requireHttpsMetadata is off only there).
  # The Cosmos key below is the emulator's published fixed key, not a secret. The ordering client secret comes from the git-ignored .env.
  # In the cloud the same settings come from the environment (Terraform and Key Vault references), and the only auth values that change
  # are Auth__Authority / Auth__MetadataAddress / ServiceAuth__* (docs/operations/local-dev.md, "Moving to Entra").
  catalog:
    build: { context: ., dockerfile: services/Dockerfile.dotnet, args: { PROJECT: services/catalog-service/src/CatalogService.csproj, ASSEMBLY: CatalogService, PORT: "5200" } }
    image: bakery-catalog:dev
    profiles: ["apps"]
    depends_on: { redis-events: { condition: service_healthy }, cosmos: { condition: service_started }, mock-oidc: { condition: service_started } }
    environment: &dotnet-env
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: http://localhost:${MOCK_OIDC_PORT:-5100}
      Auth__MetadataAddress: http://mock-oidc:5100/.well-known/openid-configuration
      Auth__Audience: bakery-marketplace
      Data__Backend: cosmos
      Events__Backend: redis
      Redis__ConnectionString: redis-events:6379
      # Traces: empty means no export. To see them, run the tracing profile too and set APPS_OTLP_ENDPOINT=http://aspire-dashboard:18889 (OTLP/gRPC, container network).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${APPS_OTLP_ENDPOINT:-}
      Cosmos__ConnectionString: AccountEndpoint=http://cosmos:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
    ports: ["127.0.0.1:${CATALOG_PORT:-5200}:5200"]

  ordering:
    build: { context: ., dockerfile: services/Dockerfile.dotnet, args: { PROJECT: services/ordering-service/src/OrderingService.csproj, ASSEMBLY: OrderingService, PORT: "5300" } }
    image: bakery-ordering:dev
    profiles: ["apps"]
    depends_on: { redis-events: { condition: service_healthy }, cosmos: { condition: service_started }, mock-oidc: { condition: service_started }, catalog: { condition: service_started } }
    environment:
      <<: *dotnet-env
      Catalog__BaseUrl: http://catalog:5200
      ServiceAuth__TokenEndpoint: http://mock-oidc:5100/token
      ServiceAuth__ClientId: ordering-service
      ServiceAuth__Scope: bakery-marketplace/.default
      ServiceAuth__ClientSecret: ${ORDERING_CLIENT_SECRET:-} # from .env (node scripts/dev/init-env.mjs); empty makes ordering stop at start-up, naming the missing setting
    ports: ["127.0.0.1:${ORDERING_PORT:-5300}:5300"]

  # NOT-001: consumes the order events from the same Redis Streams (its own consumer group) and "sends" through the log sender; no real provider.
  notification:
    build: { context: ., dockerfile: services/Dockerfile.dotnet, args: { PROJECT: services/notification-service/src/NotificationService.csproj, ASSEMBLY: NotificationService, PORT: "5400" } }
    image: bakery-notification:dev
    profiles: ["apps"]
    depends_on: { redis-events: { condition: service_healthy } }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Events__Backend: redis
      Redis__ConnectionString: redis-events:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${APPS_OTLP_ENDPOINT:-}
    ports: ["127.0.0.1:${NOTIFICATION_PORT:-5400}:5400"]

  graphql-bff:
    build: { context: ., dockerfile: services/graphql-bff/Dockerfile }
    image: bakery-bff:dev
    profiles: ["apps"]
    environment:
      CATALOG_URL: http://catalog:5200
      ORDERING_URL: http://ordering:5300
      ENABLE_TEST_HOOKS: ${ENABLE_TEST_HOOKS:-} # tests only (the declined-payment hook); never set it elsewhere
    ports: ["127.0.0.1:${BFF_PORT:-4100}:4100"]

  web:
    build: { context: ., dockerfile: apps/web-customer/Dockerfile, }
    image: bakery-web:dev
    profiles: ["apps"]
    environment:
      GRAPHQL_URL: http://graphql-bff:4100/graphql # read at run time (ADR-0020); the same image runs in every environment
      GRAPHQL_EXTRA_FORWARDED_HEADERS: ${GRAPHQL_EXTRA_FORWARDED_HEADERS:-} # tests only (x-test-payment); empty elsewhere
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-} # the smoke run raises it (its journeys log in quickly); empty means the default of 10
      # The login happens on this container's server (ADR-0019). AUTH_ISSUER is the browser's address for the mock issuer, as in MockOidc__Issuer;
      # AUTH_ISSUER_INTERNAL is this container's own address for its token endpoint.
      AUTH_ISSUER: http://localhost:${MOCK_OIDC_PORT:-5100}
      AUTH_ISSUER_INTERNAL: http://mock-oidc:5100
      AUTH_CLIENT_ID: web-customer
      APP_ORIGIN: http://localhost:${WEB_PORT:-3000}
      # Sessions live in the cache Redis (compose profile with-redis, started with `apps`), encrypted with the key init-env.mjs puts in .env.
      SESSION_REDIS_URL: redis://redis-cache:6379
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
    depends_on:
      redis-cache: { condition: service_healthy, required: false }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
