# The stages of an environment's operations pipeline (ADR-0020 decision 9: the environments run the same code; WI-DEP-002 step 2b). The calling
# file (azure-pipelines-dev.yml; later azure-pipelines-uat.yml) owns the triggers, the run parameters it offers, its variables (ENVIRONMENT_NAME,
# RESOURCE_GROUP, FOUNDATION_RESOURCE_GROUP, TF_VERSION, TF_ZIP_SHA256 and the private ones set in Azure DevOps) and the pool, and passes the
# connections and approval environments here. What each stage does is described in the header of azure-pipelines-dev.yml.
parameters:
  # The run's choices, passed through from the calling file's run parameters.
  - name: action
    type: string
  - name: planMode
    type: string
  - name: simulateInfrastructureChanges
    type: boolean
  - name: holdSeconds
    type: number
  - name: confirmEnvironment
    type: string
  # The environment's connections and approval environments (configured in Azure DevOps; never a run parameter).
  - name: planConnection
    type: string
  - name: deployConnection
    type: string
  - name: infraEnvironment
    type: string
  - name: appEnvironment
    type: string
  - name: destroyEnvironment
    type: string

stages:
  # ---- every run: the inputs are checked before anything else, and the run can only go on from main ------------------------------------
  - stage: inputs
    displayName: Check the inputs
    jobs:
      - job: inputs
        steps:
          - checkout: self
          - script: |
              set -eu
              echo "Branch: $(Build.SourceBranch)   Reason: $(Build.Reason)"
              if [ "$(Build.Reason)" != "Manual" ]; then echo "##vso[task.logissue type=error]This pipeline runs only when queued by hand."; exit 1; fi
              if [ "${{ parameters.action }}" = "destroy" ] && [ "${{ parameters.confirmEnvironment }}" != "$(ENVIRONMENT_NAME)" ]; then
                echo "##vso[task.logissue type=error]To destroy, the confirmation must be exactly the environment name: $(ENVIRONMENT_NAME)"
                exit 1
              fi
              echo "Inputs are acceptable: action=${{ parameters.action }}"
            displayName: Manual run, and for a destroy the typed confirmation (must equal the environment name)

  # ---- deploy: infrastructure first (its apply is asked for only if the plan has changes), then the application ---------------------------
  - ${{ if eq(parameters.action, 'deploy') }}:
      - stage: infra_plan
        displayName: Infrastructure plan
        dependsOn: inputs
        jobs:
          - job: plan
            steps:
              - checkout: self
              - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                  - script: |
                      set -eu
                      echo "REHEARSAL - the real step runs terraform plan -lock=false -detailed-exitcode -out=tfplan   (exit 0 = no changes, 2 = changes)"
                      if [ "${{ parameters.simulateInfrastructureChanges }}" = "True" ] || [ "${{ parameters.simulateInfrastructureChanges }}" = "true" ]; then
                        echo "Simulated plan exit code: 2 (changes)"
                        echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
                      else
                        echo "Simulated plan exit code: 0 (no changes)"
                        echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false"
                      fi
                    name: plan
                    displayName: Plan (rehearsal)

              - ${{ if eq(parameters.planMode, 'real') }}:
                  - template: terraform-tools.yml
                  - task: AzureCLI@2
                    displayName: The plan identity checks its own roles and that it cannot create (bootstrap check 6)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: node scripts/ci/identity-check.mjs --identity plan --environment "$(ENVIRONMENT_NAME)" --probe-name "rg-bakery-plan-probe-$(Build.BuildId)"
                  - task: AzureCLI@2
                    displayName: The plan identity checks the deploy identity's complete roles (it reads every scope; the deploy identity cannot)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: node scripts/ci/identity-check.mjs --identity deploy --principal "$DEPLOY_PRINCIPAL_ID" --environment "$(ENVIRONMENT_NAME)"

                  # The binary plan and its JSON stay on the agent; only the value-free summary is published.
                  # -refresh=false (register 213): refreshing a Key Vault secret reads its value (GetSecret), which the read-only identity may not
                  # do, so the plan is made from the state alone, like the destroy plan. The apply stage's re-plan is made the same way, so the two match.
                  - task: AzureCLI@2
                    name: plan
                    displayName: Terraform plan of the dev stack from the state (read-only identity, no lock, no refresh; publishes a summary only)
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                      BUDGET_CONTACT_EMAIL: $(BUDGET_CONTACT_EMAIL)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        set -euo pipefail
                        source scripts/ci/dev-stack-env.sh "${PLAN_CONNECTION_ID:-}" "$(ENVIRONMENT_NAME)"
                        set +e
                        terraform -chdir=infra/environments/dev plan -input=false -lock=false -refresh=false -detailed-exitcode -out=tfplan
                        rc=$?
                        set -e
                        if [ "$rc" -eq 1 ]; then exit 1; fi
                        json="$(Agent.TempDirectory)/plan.json"
                        terraform -chdir=infra/environments/dev show -json tfplan > "$json"
                        mkdir -p "$(Build.ArtifactStagingDirectory)/plan-summary"
                        node scripts/ci/plan-summary.mjs --plan "$json" --exit-code "$rc" --out "$(Build.ArtifactStagingDirectory)/plan-summary/dev-plan-summary.json"
                        rm -f "$json" infra/environments/dev/tfplan

                  - publish: $(Build.ArtifactStagingDirectory)/plan-summary
                    artifact: dev-plan-summary
                    displayName: Publish the plan summary (addresses and actions only, no values)

      # Runs, and asks for approval, only when the plan has changes. With no changes this stage is skipped and nobody is asked.
      - stage: infra_apply
        displayName: Infrastructure apply (approval)
        dependsOn: infra_plan
        condition: and(succeeded(), eq(dependencies.infra_plan.outputs['plan.plan.hasChanges'], 'true'))
        jobs:
          - deployment: apply
            environment: ${{ parameters.infraEnvironment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                        - script: |
                            set -eu
                            echo "REHEARSAL - the real step re-plans under the lock, checks it is the approved plan, then applies it."
                            echo "Started $(date -u +%H:%M:%S)Z; holding for ${{ parameters.holdSeconds }} seconds (lock test)."
                            sleep ${{ parameters.holdSeconds }}
                            echo "Finished $(date -u +%H:%M:%S)Z"
                          displayName: Apply the saved plan (rehearsal)

                    - ${{ if eq(parameters.planMode, 'real') }}:
                        - checkout: self
                        - template: terraform-tools.yml
                        - download: current
                          artifact: dev-plan-summary
                          displayName: The approved plan summary
                        - task: AzureCLI@2
                          displayName: The deploy identity checks its own roles and that it cannot create (bootstrap check 6)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: node scripts/ci/identity-check.mjs --identity deploy --environment "$(ENVIRONMENT_NAME)" --probe-name "rg-bakery-deploy-probe-$(Build.BuildId)"

                        # Register item 110: the plan applied is made here, under the lock, and must equal the approved plan; it never leaves this step.
                        # From the state, like the approved plan (register 213): a refreshed re-plan would differ from it after any drift and refuse
                        # every run, since nothing else refreshes the state. Drift in Azure is overwritten by the apply, not detected.
                        - task: AzureCLI@2
                          displayName: Re-plan under the lock, refuse unless it is the approved plan, then apply it
                          env:
                            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                            BUDGET_CONTACT_EMAIL: $(BUDGET_CONTACT_EMAIL)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            addSpnToEnvironment: true
                            inlineScript: |
                              set -euo pipefail
                              source scripts/ci/dev-stack-env.sh "${DEPLOY_CONNECTION_ID:-}" "$(ENVIRONMENT_NAME)"
                              set +e
                              terraform -chdir=infra/environments/dev plan -input=false -refresh=false -detailed-exitcode -out=tfplan
                              rc=$?
                              set -e
                              if [ "$rc" -eq 1 ]; then exit 1; fi
                              json="$(Agent.TempDirectory)/plan.json"
                              terraform -chdir=infra/environments/dev show -json tfplan > "$json"
                              node scripts/ci/plan-summary.mjs --plan "$json" --exit-code "$rc" --out "$(Agent.TempDirectory)/apply-summary.json" --expect "$(Pipeline.Workspace)/dev-plan-summary/dev-plan-summary.json"
                              rm -f "$json"
                              terraform -chdir=infra/environments/dev apply -input=false tfplan
                              rm -f infra/environments/dev/tfplan
                              terraform -chdir=infra/environments/dev output

      # The images are built while the infrastructure is planned, with no service connection and no registry, so a broken build fails before
      # anyone is asked to approve. Only the approved application deploy pushes them (bakery-deploy holds AcrPush and is used only in approved
      # jobs; decided by the lead 2026-11-20). Build once, promote by digest (ADR-0020 decision 1): the record of the pushed digests is published.
      - stage: images
        displayName: Build the application images (no credentials)
        dependsOn: inputs
        jobs:
          - job: build
            timeoutInMinutes: 60
            steps:
              - checkout: self
              - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                  - script: echo "REHEARSAL - the real step builds the six images (scripts/ci/dev-images.mjs build) and publishes them as the dev-images artifact."
                    displayName: Build the images (rehearsal)

              - ${{ if eq(parameters.planMode, 'real') }}:
                  - task: UseNode@1
                    inputs:
                      version: '24.x'
                  - script: node scripts/ci/dev-images.mjs build --tag "$(Build.BuildId)" --revision "$(Build.SourceVersion)" --out "$(Build.ArtifactStagingDirectory)/dev-images"
                    displayName: Build the six images one at a time and save them (no registry, no credentials)
                  - publish: $(Build.ArtifactStagingDirectory)/dev-images
                    artifact: dev-images
                    displayName: Publish the saved images and their ids

      # Needs the plan and image stages to have succeeded and the apply stage to have either succeeded or been skipped (no changes).
      - stage: app_deploy
        displayName: Application deploy (approval)
        dependsOn:
          - infra_plan
          - infra_apply
          - images
        condition: and(succeeded('infra_plan'), succeeded('images'), in(dependencies.infra_apply.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
        jobs:
          - deployment: deploy
            environment: ${{ parameters.appEnvironment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                        - script: |
                            echo "REHEARSAL - the real steps push the built images, update each container app to its digest (az containerapp update),"
                            echo "then run the post-deploy smoke against the deployed address and publish its result."
                          displayName: Push the images, update the apps and smoke (rehearsal)

                    - ${{ if eq(parameters.planMode, 'real') }}:
                        - checkout: self
                        - task: UseNode@1
                          inputs:
                            version: '24.x'
                        - download: current
                          artifact: dev-images
                          displayName: The images the image stage built
                        - task: AzureCLI@2
                          displayName: The deploy identity checks its own roles and that it cannot create (bootstrap check 6)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: node scripts/ci/identity-check.mjs --identity deploy --environment "$(ENVIRONMENT_NAME)" --probe-name "rg-bakery-deploy-probe-$(Build.BuildId)"

                        # The post-apply secret step (ADR-0020 amendment; rules: docs/architecture/secrets-and-sensitive-values.md, decision 3).
                        # Sets each Key Vault secret that still holds Terraform's placeholder: the Cosmos connection string read from Azure, the
                        # client secret and the session key generated. A value goes through a mode-600 file in the job's temporary folder, deleted
                        # at once, never a command line; it is masked in the log. A secret already set is kept, so a redeploy rotates nothing.
                        - task: AzureCLI@2
                          displayName: Set the secrets that still hold their placeholder (values only through a temporary file)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: node scripts/ci/dev-secrets.mjs --vault "$(KEY_VAULT_NAME)" --cosmos-account "$(COSMOS_ACCOUNT_NAME)" --resource-group "$(RESOURCE_GROUP)" --temp "$(Agent.TempDirectory)"

                        # The registry is the one in the foundation group (its name is private, so it is looked up, not typed). The script refuses
                        # unless the loaded images are the ones the build recorded, then pushes each and records its digest.
                        - task: AzureCLI@2
                          displayName: Push the images to the registry and record their digests
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: |
                              set -euo pipefail
                              registries=$(az acr list --resource-group "$(FOUNDATION_RESOURCE_GROUP)" --query "[].name" -o tsv)
                              if [ "$(echo "$registries" | grep -c .)" -ne 1 ]; then
                                echo "##vso[task.logissue type=error]Expected one registry in $(FOUNDATION_RESOURCE_GROUP), found: ${registries:-none}"
                                exit 1
                              fi
                              az acr login --name "$registries"
                              login=$(az acr show --name "$registries" --query loginServer -o tsv)
                              mkdir -p "$(Build.ArtifactStagingDirectory)/dev-images-pushed"
                              node scripts/ci/dev-images.mjs push --in "$(Pipeline.Workspace)/dev-images" --registry "$login" --out "$(Build.ArtifactStagingDirectory)/dev-images-pushed/dev-images-pushed.json"
                        - publish: $(Build.ArtifactStagingDirectory)/dev-images-pushed
                          artifact: dev-images-pushed
                          displayName: Publish the record of the pushed images (each app's image by digest)

                        # Register 110: refuses, before changing anything, if any app runs a newer build than this one. Each app gets a new revision
                        # named for this run, so it also reads the secrets set above, and the step waits until every revision is provisioned.
                        - task: AzureCLI@2
                          displayName: Update each app to its pushed digest in a new revision (refuses an older build)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: |
                              set -euo pipefail
                              mkdir -p "$(Build.ArtifactStagingDirectory)/dev-deployment"
                              node scripts/ci/dev-deploy.mjs --record "$(Build.ArtifactStagingDirectory)/dev-images-pushed/dev-images-pushed.json" --resource-group "$(RESOURCE_GROUP)" --suffix "b$(Build.BuildId)-$(System.JobAttempt)" --out "$(Build.ArtifactStagingDirectory)/dev-deployment/dev-deployment.json"
                        - publish: $(Build.ArtifactStagingDirectory)/dev-deployment
                          artifact: dev-deployment
                          displayName: Publish the record of the deployment (each app's image before and after, and its revision)

      # The post-deploy smoke, from outside: the deployed customer suite (11 tests) and the latency run, against the two public addresses only, with no
      # service connection (nothing on this agent can change Azure). Its addresses come from the deployment record. Evidence is published whatever the result.
      - stage: smoke
        displayName: Post-deploy smoke (no credentials)
        dependsOn: app_deploy
        condition: succeeded()
        jobs:
          - job: smoke
            timeoutInMinutes: 60
            steps:
              - checkout: self
              - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                  - script: echo "REHEARSAL - the real steps run the deployed suite (playwright.deployed.config.ts) and scripts/ci/deployed-latency.mjs against the deployed addresses."
                    displayName: Post-deploy smoke (rehearsal)

              - ${{ if eq(parameters.planMode, 'real') }}:
                  - task: UseNode@1
                    inputs:
                      version: '24.x'
                  - download: current
                    artifact: dev-deployment
                    displayName: The deployment record (the public addresses)
                  - script: |
                      set -euo pipefail
                      for d in packages/chaos packages/web-session packages/customer-core apps/web-customer; do (cd "$d" && npm ci --no-audit --no-fund); done
                      cd apps/web-customer && npx playwright install --with-deps chromium
                    displayName: Install the web app's test tools and Chromium
                  - script: |
                      set -uo pipefail
                      record="$(Pipeline.Workspace)/dev-deployment/dev-deployment.json"
                      web=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).urls.web)" "$record")
                      issuer=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).urls['mock-oidc'])" "$record")
                      out="$(Build.ArtifactStagingDirectory)/dev-smoke"
                      mkdir -p "$out"
                      (cd apps/web-customer && WEB_URL="$web" ISSUER_URL="$issuer" DEPLOYED_EVIDENCE_DIR="$out" DEPLOYED_WHERE=agent npx playwright test -c playwright.deployed.config.ts)
                      suite=$?
                      node scripts/ci/deployed-latency.mjs --web "$web" --issuer "$issuer" --where agent --json "$out/latency-agent.json"
                      latency=$?
                      echo "Deployed suite exit $suite, latency exit $latency."
                      if [ "$suite" -ne 0 ] || [ "$latency" -ne 0 ]; then exit 1; fi
                    displayName: The deployed customer suite, then latency from the agent
                  - publish: $(Build.ArtifactStagingDirectory)/dev-smoke
                    artifact: dev-smoke
                    displayName: Publish the smoke evidence (reports, screenshots, correlation ids, latency)
                    condition: always()

      # What the platform saw during the smoke (register 221): metrics and log counts, and which correlation ids reached the log. The read-only identity;
      # it runs after the smoke whether the smoke passed or failed, so a failure has its evidence too.
      - stage: observe
        displayName: Observability evidence (read-only)
        dependsOn:
          - app_deploy
          - smoke
        condition: and(succeeded('app_deploy'), in(dependencies.smoke.result, 'Succeeded', 'SucceededWithIssues', 'Failed'))
        jobs:
          - job: observe
            steps:
              - checkout: self
              - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                  - script: echo "REHEARSAL - the real step reads the run's metrics and log counts (scripts/ci/dev-observe.mjs) as the read-only identity."
                    displayName: Observability evidence (rehearsal)

              - ${{ if eq(parameters.planMode, 'real') }}:
                  - task: UseNode@1
                    inputs:
                      version: '24.x'
                  - download: current
                    artifact: dev-deployment
                    displayName: The deployment record (the window's start)
                  - download: current
                    artifact: dev-smoke
                    displayName: The smoke's correlation ids
                  - task: AzureCLI@2
                    displayName: Metrics and log counts of the run, and which correlation ids reached the log (read-only identity)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        mkdir -p "$(Build.ArtifactStagingDirectory)/dev-observe"
                        node scripts/ci/dev-observe.mjs --resource-group "$(RESOURCE_GROUP)" --workspace "log-bakery-$(ENVIRONMENT_NAME)" --deployment "$(Pipeline.Workspace)/dev-deployment/dev-deployment.json" --correlation "$(Pipeline.Workspace)/dev-smoke/correlation-ids.jsonl" --out "$(Build.ArtifactStagingDirectory)/dev-observe/observe.json"
                  - publish: $(Build.ArtifactStagingDirectory)/dev-observe
                    artifact: dev-observe
                    displayName: Publish the observability evidence (counts and ids only, no log text)
                    condition: always()

  # ---- destroy: a plan, the guard, then the approval, then the destroy of a re-plan that must equal the approved one --------------------
  - ${{ if eq(parameters.action, 'destroy') }}:
      - stage: destroy_plan
        displayName: Destroy plan and guard
        dependsOn: inputs
        jobs:
          - job: guard
            steps:
              - checkout: self
              - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                  - task: UseNode@1
                    inputs:
                      version: '24.x'
                  - script: |
                      echo "REHEARSAL - the real step runs terraform plan -destroy -refresh=false -lock=false -out=tfplan, then the guard on it"
                      echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
                    name: plan
                    displayName: Destroy plan (rehearsal)
                  # The real guard, on a fixture plan. It must pass here, and it refuses in its tests anything that is not a pure destroy
                  # confined to the environment's resource group.
                  - script: >
                      node scripts/ci/destroy-guard.mjs
                      --plan scripts/ci/tests/fixtures/destroy-plan-dev.json
                      --environment $(ENVIRONMENT_NAME)
                      --resource-group $(RESOURCE_GROUP)
                      --confirm "${{ parameters.confirmEnvironment }}"
                    displayName: Destroy guard (the real script, on a fixture plan)

              - ${{ if eq(parameters.planMode, 'real') }}:
                  - template: terraform-tools.yml
                  - task: AzureCLI@2
                    displayName: The plan identity checks its own roles and that it cannot create (bootstrap check 6)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: node scripts/ci/identity-check.mjs --identity plan --environment "$(ENVIRONMENT_NAME)" --probe-name "rg-bakery-plan-probe-$(Build.BuildId)"
                  - task: AzureCLI@2
                    displayName: The plan identity checks the deploy identity's complete roles (it reads every scope; the deploy identity cannot)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: node scripts/ci/identity-check.mjs --identity deploy --principal "$DEPLOY_PRINCIPAL_ID" --environment "$(ENVIRONMENT_NAME)"

                  # -refresh=false: the destroy plan is made from the state alone, so the read-only identity reads nothing in Azure (no secret,
                  # no key) and the plan lists exactly what the state manages. The apply stage re-plans with refresh after the approval.
                  - task: AzureCLI@2
                    name: plan
                    displayName: Destroy plan from the state (read-only identity, no lock, no refresh) and the guard on it
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                      BUDGET_CONTACT_EMAIL: $(BUDGET_CONTACT_EMAIL)
                    inputs:
                      azureSubscription: ${{ parameters.planConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        set -euo pipefail
                        source scripts/ci/dev-stack-env.sh "${PLAN_CONNECTION_ID:-}" "$(ENVIRONMENT_NAME)"
                        set +e
                        terraform -chdir=infra/environments/dev plan -destroy -input=false -lock=false -refresh=false -detailed-exitcode -out=tfplan
                        rc=$?
                        set -e
                        if [ "$rc" -eq 1 ]; then exit 1; fi
                        json="$(Agent.TempDirectory)/plan.json"
                        terraform -chdir=infra/environments/dev show -json tfplan > "$json"
                        node scripts/ci/destroy-guard.mjs --plan "$json" --environment "$(ENVIRONMENT_NAME)" --resource-group "$(RESOURCE_GROUP)" --confirm "${{ parameters.confirmEnvironment }}"
                        mkdir -p "$(Build.ArtifactStagingDirectory)/destroy-summary"
                        node scripts/ci/plan-summary.mjs --plan "$json" --exit-code "$rc" --out "$(Build.ArtifactStagingDirectory)/destroy-summary/dev-destroy-summary.json"
                        rm -f "$json" infra/environments/dev/tfplan

                  - publish: $(Build.ArtifactStagingDirectory)/destroy-summary
                    artifact: dev-destroy-summary
                    displayName: Publish the destroy summary (addresses and actions only, no values)

      # Asked for only when there is something to destroy.
      - stage: destroy_apply
        displayName: Destroy (approval)
        dependsOn: destroy_plan
        condition: and(succeeded(), eq(dependencies.destroy_plan.outputs['guard.plan.hasChanges'], 'true'))
        jobs:
          - deployment: destroy
            environment: ${{ parameters.destroyEnvironment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - ${{ if eq(parameters.planMode, 'rehearsal') }}:
                        - script: |
                            echo "REHEARSAL - the real step re-plans the destroy, runs the guard again, checks it is the approved plan, destroys, and checks the group is empty."
                          displayName: Destroy the saved plan (rehearsal)

                    - ${{ if eq(parameters.planMode, 'real') }}:
                        - checkout: self
                        - template: terraform-tools.yml
                        - download: current
                          artifact: dev-destroy-summary
                          displayName: The approved destroy summary
                        - task: AzureCLI@2
                          displayName: The deploy identity checks its own roles and that it cannot create (bootstrap check 6)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: node scripts/ci/identity-check.mjs --identity deploy --environment "$(ENVIRONMENT_NAME)" --probe-name "rg-bakery-deploy-probe-$(Build.BuildId)"

                        - task: AzureCLI@2
                          displayName: Re-plan the destroy under the lock, guard it, refuse unless it is the approved plan, destroy, check the group is empty
                          env:
                            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                            BUDGET_CONTACT_EMAIL: $(BUDGET_CONTACT_EMAIL)
                          inputs:
                            azureSubscription: ${{ parameters.deployConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            addSpnToEnvironment: true
                            inlineScript: |
                              set -euo pipefail
                              source scripts/ci/dev-stack-env.sh "${DEPLOY_CONNECTION_ID:-}" "$(ENVIRONMENT_NAME)"
                              set +e
                              terraform -chdir=infra/environments/dev plan -destroy -input=false -detailed-exitcode -out=tfplan
                              rc=$?
                              set -e
                              if [ "$rc" -eq 1 ]; then exit 1; fi
                              json="$(Agent.TempDirectory)/plan.json"
                              terraform -chdir=infra/environments/dev show -json tfplan > "$json"
                              node scripts/ci/destroy-guard.mjs --plan "$json" --environment "$(ENVIRONMENT_NAME)" --resource-group "$(RESOURCE_GROUP)" --confirm "${{ parameters.confirmEnvironment }}"
                              node scripts/ci/plan-summary.mjs --plan "$json" --exit-code "$rc" --out "$(Agent.TempDirectory)/destroy-summary.json" --expect "$(Pipeline.Workspace)/dev-destroy-summary/dev-destroy-summary.json"
                              rm -f "$json"
                              start=$(date +%s)
                              terraform -chdir=infra/environments/dev apply -input=false tfplan
                              echo "Destroy took $(( $(date +%s) - start )) seconds."
                              rm -f infra/environments/dev/tfplan
                              # Azure's resource list lags a delete: the first real teardown (2026-11-20) still listed the Log Analytics
                              # workspace just after Terraform had deleted it, and the group was empty minutes later. Ask again for up to
                              # 10 minutes before failing; anything still listed then is a real leftover.
                              for attempt in $(seq 1 20); do
                                left=$(az resource list -g "$(RESOURCE_GROUP)" --query "[].{type:type, name:name}" -o tsv)
                                if [ -z "$left" ] || [ "$attempt" -eq 20 ]; then break; fi
                                echo "Still listed in $(RESOURCE_GROUP) (check $attempt of 20); asking again in 30 seconds:"; echo "$left"
                                sleep 30
                              done
                              if [ -n "$left" ]; then
                                echo "##vso[task.logissue type=error]Resources are left in $(RESOURCE_GROUP) after the destroy:"; echo "$left"; exit 1
                              fi
                              echo "$(RESOURCE_GROUP) is empty."
